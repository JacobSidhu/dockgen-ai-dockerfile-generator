name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # allow a manual run from the Actions tab

# One run per branch/PR; a new push cancels the old PR run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast static checks
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy types-requests

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Mypy (type check)
        run: mypy dockgen.py

      - name: ShellCheck (bench.sh)
        run: shellcheck --severity=warning bench.sh

  # ---------------------------------------------------------------------------
  # 2. Security checks
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # 3. CLI tests: no Ollama or Docker needed
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: CLI help works
        run: python dockgen.py --help

      - name: Context building works on every sample (--show-context)
        # --show-context exits before touching Docker or Ollama.
        run: |
          for sample in samples/*/; do
            echo "=== $sample ==="
            python dockgen.py "$sample" --show-context > context.txt
            if grep -q "Detected language: unknown" context.txt; then
              echo "::error::language not detected for $sample"; exit 1
            fi
          done

      - name: Rejects a non-folder argument
        run: |
          if python dockgen.py does-not-exist; then
            echo "expected a non-zero exit for a missing folder"; exit 1
          fi

      - name: Unit tests (pytest)
        # Runs once a tests/ folder exists.
        run: |
          if [ -d tests ]; then
            pytest -v
          else
            echo "::warning::No tests/ folder yet; skipping pytest"
          fi
